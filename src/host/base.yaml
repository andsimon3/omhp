openapi: 3.0.3
info:
  title: OMHP Host API
  description: Open Media Host Protocol - Host API
  version: 1.0.0
tags:
  - name: Host
paths:
  /:
    get:
      tags:
        - Host
      summary: Данные о хостинге
      description: Информация о поддерживаемых типах контента и версиях API
      responses:
        '200':
          description: Информация о хостинге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostInfo'
  /mediamap:
    get:
      summary: Получение mediamap
      description: |
        Дочерние mediamap могут находится где угодно. Главное, чтобы на них ссылался основной.
        К примеру можно разделить /image/mediamap и /video/mediamap.
      responses:
        '200':
          description: Список относительных путей на ресурсы или другие mediamap
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    HostInfo:
      type: object
      required:
        - content-type
        - api-version
        - name
      properties:
        name:
          type: string
        law-description:
          type: string
  parameters: {}
  responses: {}
  securitySchemes: {}
  requestBodies: {}
  headers: {}
  examples: {}
  links: {}
  callbacks: {}
