openapi: 3.0.3
info:
  title: OMHP Host API - Video
  description: Open Media Host Protocol - Video
  version: 1.0.0
tags:
  - name: Content
paths:
  /video/{id}:
    get:
      tags:
        - Content
      summary: Получение данных о видео
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация о видео
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoContent'
components:
  schemas:
    VideoContent:
      allOf:
        - $ref: '../../shared.yaml#/components/schemas/ContentBase'
        - type: object
          properties:
            title:
              type: string
            source:
              oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum: ['h256', 'VP9']
                    link:
                      type: string
                  required:
                    - type
                    - link
                - type: object
                  properties:
                    type:
                      type: string
                      enum: ['hls', 'dash']
                    manifest:
                      type: string
                  required:
                    - type
                    - manifest
          required:
            - title
            - source
  parameters: {}
  responses: {}
  securitySchemes: {}
  requestBodies: {}
  headers: {}
  examples: {}
  links: {}
  callbacks: {}